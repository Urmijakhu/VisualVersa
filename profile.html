<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisualVersa | My Profile</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.profile-card {
    width: 90%;
    max-width: 420px;
    padding: 35px;
    text-align: center;
    border: 1px solid #c9a45c;
    border-radius: 12px;
    background: #111;
}

h1 {
    color: #c9a45c;
    margin-bottom: 25px;
}

.avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 2px solid #c9a45c;
    margin: 0 auto 15px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: #c9a45c;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

p {
    margin: 12px 0;
    color: #ddd;
    overflow-wrap: anywhere;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    background: #080808;
    border: 1px solid #c9a45c;
    color: white;
    border-radius: 5px;
}

input[type="file"] {
    font-size: 12px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: 1px solid #c9a45c;
    background: transparent;
    color: #c9a45c;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #c9a45c;
    color: #000;
}

#status {
    color: #c9a45c;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="profile-card">

    <h1>My Profile</h1>

    <div class="avatar" id="avatar">👤</div>

    <p>Account Email</p>
    <p id="userEmail">Checking account...</p>

    <p>Full Name</p>
    <input type="text" id="userName" placeholder="Enter your full name">

    <p>Profile Photo</p>
    <input type="file" id="photoInput" accept="image/*">

    <button id="saveProfile">Save Changes</button>

    <p id="status"></p>

    <button onclick="window.location.href='index.html'">
        Back to Home
    </button>

    <button id="switchAccount">Switch Account</button>

    <button id="logoutButton">Logout</button>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyA8AjN2InsgSG9_smQVAwCnqTaiTPyOxpE",
    authDomain: "visualversa-ec2dc.firebaseapp.com",
    projectId: "visualversa-ec2dc",
    storageBucket: "visualversa-ec2dc.firebasestorage.app",
    messagingSenderId: "721396543460",
    appId: "1:721396543460:web:39e033c4ba0b51599aa1f1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const avatar = document.getElementById("avatar");
const userName = document.getElementById("userName");
const userEmail = document.getElementById("userEmail");
const photoInput = document.getElementById("photoInput");
const status = document.getElementById("status");

let currentUser = null;
let selectedPhoto = "";

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.replace("auth.html");
        return;
    }

    currentUser = user;
    userEmail.textContent = user.email || "Email unavailable";

    const saved = JSON.parse(
        localStorage.getItem("visualversa_profile_" + user.uid) || "{}"
    );

    userName.value = saved.name || "";
    selectedPhoto = saved.photo || "";

    if (selectedPhoto) {
        avatar.innerHTML = `<img src="${selectedPhoto}" alt="Profile Photo">`;
    }

});

photoInput.addEventListener("change", () => {

    const file = photoInput.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        status.textContent = "Please select a valid image.";
        photoInput.value = "";
        return;
    }

    if (file.size > 5 * 1024 * 1024) {
        status.textContent = "Image must be smaller than 5 MB.";
        photoInput.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = (event) => {

        const image = new Image();

        image.onload = () => {

            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");

            canvas.width = 300;
            canvas.height = 300;

            const size = Math.min(image.width, image.height);

            context.drawImage(
                image,
                (image.width - size) / 2,
                (image.height - size) / 2,
                size,
                size,
                0,
                0,
                300,
                300
            );

            selectedPhoto = canvas.toDataURL("image/jpeg", 0.75);

            avatar.innerHTML =
                `<img src="${selectedPhoto}" alt="Profile Photo">`;

            status.textContent = "Photo selected. Click Save Changes.";

        };

        image.src = event.target.result;

    };

    reader.readAsDataURL(file);

});

document.getElementById("saveProfile").addEventListener("click", () => {

    if (!currentUser) return;

    const name = userName.value.trim();

    if (!name) {
        status.textContent = "Please enter your name.";
        return;
    }

    try {

        localStorage.setItem(
            "visualversa_profile_" + currentUser.uid,
            JSON.stringify({
                name: name,
                photo: selectedPhoto
            })
        );

        status.textContent = "Profile saved successfully!";

    } catch (error) {

        status.textContent = "Could not save profile. Try a smaller photo.";

    }

});

document.getElementById("switchAccount").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "auth.html";
});

document.getElementById("logoutButton").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "index.html";
});

</script>

</body>
</html>
