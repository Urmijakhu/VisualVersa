<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisualVersa | Login</title>

<style>



/* VISUALVERSA - PREMIUM BLACK & GOLD LOGIN */

:root {
    --gold: #d9ad75;
    --dark: #111111;
    --card: #1c1c1c;
    --muted: #aaaaaa;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: #111111;
    color: white;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 16px;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at 50% 50%,
            #292117 0%,
            #17130f 35%,
            #111111 75%
        );
}

/* Main container */

.container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Login Card */

#authBox {
    width: 100%;
    max-width: 420px;
    padding: 42px 35px;
    text-align: center;

    background: linear-gradient(
        145deg,
        #24211d,
        #171717
    );

    border: 1px solid rgba(217,173,117,0.65);
    border-radius: 18px;

    box-shadow:
        0 0 25px rgba(217,173,117,0.12),
        0 15px 45px rgba(0,0,0,0.5);
}

/* Brand */

#authBox h1 {
    color: var(--gold);
    font-size: 34px;
    letter-spacing: 2px;
    margin: 0 0 8px;
}

.subtitle {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 32px;
}

/* Login heading */

#formTitle {
    color: var(--gold);
    font-size: 25px;
    margin-bottom: 25px;
}

/* Form */

#authForm {
    width: 100%;
}

#authForm input {
    display: block;
    width: 100%;
    height: 48px;
    margin-bottom: 17px;
    padding: 0 15px;

    background: #111111;
    color: white;
    border: 1px solid #514638;
    border-radius: 8px;

    font-size: 14px;
    outline: none;
}

#authForm input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 8px rgba(217,173,117,0.2);
}

#authForm input::placeholder {
    color: #999999;
}

/* Forgot Password */

.forgot {
    display: block;
    text-align: right;
    margin: 0 0 22px;
    font-size: 13px;
    color: var(--gold);
    cursor: pointer;
    text-decoration: none;
}

/* Buttons */

button {
    width: 100%;
    min-height: 47px;
    border: 1px solid var(--gold);
    border-radius: 8px;
    background: var(--gold);
    color: #111111;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    background: transparent;
    color: var(--gold);
}

/* Google Button */

.google {
    margin-top: 15px;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
}

.google:hover {
    background: rgba(217,173,117,0.12);
}

/* Sign Up */

.switch {
    margin-top: 25px;
    font-size: 14px;
    color: #cccccc;
}

#switchBtn {
    color: var(--gold);
    font-weight: bold;
    margin-left: 5px;
    cursor: pointer;
    text-decoration: none;
}

/* Message */

#message {
    font-size: 13px;
    margin-top: 15px;
    overflow-wrap: anywhere;
}

/* Profile */

#profile {
    display: none;
    width: 100%;
    max-width: 420px;
    padding: 35px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--gold);
    border-radius: 18px;
    box-shadow: 0 0 25px rgba(217,173,117,0.12);
}

#profile h1 {
    color: var(--gold);
}

#profile p {
    color: #eeeeee;
    overflow-wrap: anywhere;
}

/* Mobile Responsive */

@media (max-width: 480px) {

    #authBox {
        padding: 35px 22px;
    }

    #authBox h1 {
        font-size: 29px;
    }

    #formTitle {
        font-size: 23px;
    }
}


</style>
</head>

<body>

<div class="container">

    <div id="authBox">
        <h1>VisualVersa</h1>
        <p class="subtitle">Explore. Create. Inspire.</p>

        <h2 id="formTitle">Login</h2>

        <form id="authForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                style="display:none"
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <a class="forgot" id="forgot">Forgot Password?</a>

            <button type="submit" id="submitBtn">Login</button>

        </form>

        <button class="google" id="googleBtn">
            Continue with Google
        </button>

        <p class="switch">
            <span id="switchText">Don't have an account?</span>
            <a id="switchBtn">Sign Up</a>
        </p>

        <p id="message"></p>
    </div>

    <div id="profile">
        <h1>Welcome to VisualVersa!</h1>
        <p id="userName"></p>
        <p id="userEmail"></p>
        <button id="logoutBtn">Logout</button>
    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    getAdditionalUserInfo,
    sendPasswordResetEmail,
    onAuthStateChanged,
    updateProfile,
    signOut
}
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyA8AjN2InsgSG9_smQVAwCnqTaiTPyOxpE",
    authDomain: "visualversa-ec2dc.firebaseapp.com",
    projectId: "visualversa-ec2dc",
    storageBucket: "visualversa-ec2dc.firebasestorage.app",
    messagingSenderId: "721396543460",
    appId: "1:721396543460:web:39e033c4ba0b51599aa1f1"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();
    
    googleProvider.setCustomParameters({
    prompt: "select_account"
});

let isSignup = false;

const authBox = document.getElementById("authBox");
const profile = document.getElementById("profile");
const message = document.getElementById("message");

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");


function showMessage(text, success = false) {
    message.textContent = text;
    message.style.color = success ? "green" : "red";
}


// Switch between Login and Signup

document.getElementById("switchBtn").addEventListener("click", () => {

    isSignup = !isSignup;

    document.getElementById("formTitle").textContent =
        isSignup ? "Create Account" : "Login";

    document.getElementById("submitBtn").textContent =
        isSignup ? "Sign Up" : "Login";

    nameInput.style.display = isSignup ? "block" : "none";
    nameInput.required = isSignup;

    document.getElementById("forgot").style.display =
        isSignup ? "none" : "block";

    document.getElementById("switchText").textContent =
        isSignup ? "Already have an account?" : "Don't have an account?";

    document.getElementById("switchBtn").textContent =
        isSignup ? "Login" : "Sign Up";

    showMessage("");
});


// Email Signup and Login

document.getElementById("authForm").addEventListener("submit", async (e) => {

    e.preventDefault();dInput.value;

    try {

        if (isSignup) {

            const name = nameInput.value.trim();

            const result = await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

            await updateProfile(result.user, {
                displayName: name
            });

            // New users go to enrollment
            window.location.replace("enrollment.html");

        } else {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            // Existing users go to homepage
            window.location.replace("index.html");

        }

    } catch (error) {

        showMessage(error.message);

    }

});


// Google Signup and Login

document.getElementById("googleBtn").addEventListener("click", async () => {

    try {

        const result = await signInWithPopup(auth, googleProvider);

        const additionalInfo = getAdditionalUserInfo(result);

        if (additionalInfo && additionalInfo.isNewUser) {

            // First-time Google users go to enrollment
            window.location.replace("enrollment.html");

        } else {

            // Existing Google users go to homepage
            window.location.replace("index.html");

        }

    } catch (error) {

        showMessage(error.message);

    }

});


// Forgot Password

document.getElementById("forgot").addEventListener("click", async () => {

    const email = emailInput.value.trim();

    if (!email) {
        showMessage("Please enter your email address first.");
        return;
    }

    try {

        await sendPasswordResetEmail(auth, email);

        showMessage("Password reset email sent!", true);

    } catch (error) {

        showMessage(error.message);

    }

});


// Authentication State

onAuthStateChanged(auth, (user) => {

    if (user) {

        authBox.style.display = "none";
        profile.style.display = "block";

        document.getElementById("userName").textContent =
            "Name: " + (user.displayName || "VisualVersa Member");

        document.getElementById("userEmail").textContent =
            "Email: " + user.email;

    } else {

        authBox.style.display = "block";
        profile.style.display = "none";

    }

});


// Logout

document.getElementById("logoutBtn").addEventListener("click", async () => {

    try {

        await signOut(auth);

        window.location.replace("auth.html");

    } catch (error) {

        alert(error.message);

    }

});

</script>

</body>
</html>
