
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisualVersa | Login</title>

<style>
:root {
    --gold: #d9ad75;
    --dark: #111111;
    --card: #1c1c1c;
    --muted: #aaaaaa;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: var(--dark);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    padding: 35px 28px;
    border-radius: 16px;
    border: 1px solid #38332c;
    box-shadow: 0 10px 35px rgba(0,0,0,.4);
}

h1 {
    text-align: center;
    color: var(--gold);
    margin-bottom: 10px;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 28px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    background: #111;
    color: white;
    border: 1px solid #444;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}

input:focus {
    border-color: var(--gold);
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    margin-top: 8px;
}

.primary {
    background: var(--gold);
    color: #111;
}

.google {
    background: white;
    color: #222;
}

.secondary {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.switch {
    text-align: center;
    margin-top: 22px;
    color: var(--muted);
    font-size: 14px;
}

.switch span, .forgot {
    color: var(--gold);
    cursor: pointer;
}

.forgot {
    display: block;
    text-align: right;
    font-size: 13px;
    margin-bottom: 15px;
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #888;
    margin: 18px 0;
    font-size: 13px;
}

.divider::before, .divider::after {
    content: "";
    height: 1px;
    background: #444;
    flex: 1;
}

#message {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--gold);
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div class="container">

    <h1>VisualVersa</h1>
    <p class="subtitle" id="subtitle">
        Welcome back! Login to continue.
    </p>

    <div id="authPanel">

        <input type="text" id="name"
               placeholder="Your Name"
               class="hidden"
               autocomplete="name">

        <input type="email" id="email"
               placeholder="Email Address"
               autocomplete="email">

        <input type="password" id="password"
               placeholder="Password"
               autocomplete="current-password">

        <span class="forgot" id="forgot">
            Forgot Password?
        </span>

        <button class="primary" id="submitBtn">
            Login
        </button>

        <div class="divider">OR</div>

        <button class="google" id="googleBtn">
            Continue with Google
        </button>

        <p class="switch" id="switchText">
            Don't have an account?
            <span id="switchBtn">Sign Up</span>
        </p>

    </div>

    <div id="linkPanel" class="hidden">

        <p style="text-align:center;color:#ddd;margin-bottom:18px;line-height:1.6;">
            Your Google account is connected.
            Set a password to also login using your email.
        </p>

        <input type="password" id="newPassword"
               placeholder="Create Password (minimum 6 characters)"
               autocomplete="new-password">

        <input type="password" id="confirmPassword"
               placeholder="Confirm Password"
               autocomplete="new-password">

        <button class="primary" id="linkPasswordBtn">
            Set Email Password
        </button>

        <button class="secondary" id="cancelLinkBtn">
            Logout
        </button>

    </div>

    <div id="message"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    sendPasswordResetEmail,
    EmailAuthProvider,
    linkWithCredential,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";


// FIREBASE CONFIGURATION

const firebaseConfig = {
    apiKey: "AIzaSyA8AjN2InsgSG9_smQVAwCnqTaiTPyOxpE",
    authDomain: "visualversa-ec2dc.firebaseapp.com",
    projectId: "visualversa-ec2dc",
    storageBucket: "visualversa-ec2dc.firebasestorage.app",
    messagingSenderId: "721396543460",
    appId: "1:721396543460:web:39e033c4ba0b51599aa1f1"
};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();


// ELEMENTS

const authPanel = document.getElementById("authPanel");
const linkPanel = document.getElementById("linkPanel");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const nameInput = document.getElementById("name");

const submitBtn = document.getElementById("submitBtn");
const googleBtn = document.getElementById("googleBtn");
const switchText = document.getElementById("switchText");
const forgotBtn = document.getElementById("forgot");

const linkPasswordBtn = document.getElementById("linkPasswordBtn");
const cancelLinkBtn = document.getElementById("cancelLinkBtn");

const newPasswordInput = document.getElementById("newPassword");
const confirmPasswordInput = document.getElementById("confirmPassword");

const message = document.getElementById("message");
const subtitle = document.getElementById("subtitle");

let isSignup = false;


// MESSAGE

function showMessage(text, color = "#d9ad75") {
    message.textContent = text;
    message.style.color = color;
}


// PROVIDER CHECK

function hasProvider(user, providerId) {
    return user.providerData.some(
        item => item.providerId === providerId
    );
}


// SWITCH DISPLAY

function showAuthPanel() {
    authPanel.classList.remove("hidden");
    linkPanel.classList.add("hidden");

    subtitle.textContent = isSignup
        ? "Create your VisualVersa account."
        : "Welcome back! Login to continue.";
}


// GOOGLE PASSWORD LINKING PANEL

function showLinkPanel(user) {
    authPanel.classList.add("hidden");
    linkPanel.classList.remove("hidden");

    subtitle.textContent = "Complete Your Account";

    showMessage("Google account: " + user.email);
}


// AUTH STATE

onAuthStateChanged(auth, (user) => {

    if (!user) {
        showAuthPanel();
        return;
    }

    const google = hasProvider(user, "google.com");
    const password = hasProvider(user, "password");

    if (google && !password) {
        showLinkPanel(user);
        return;
    }

    if (password) {
        window.location.replace("index.html");
    }

});


// LOGIN / SIGNUP SWITCH

switchText.addEventListener("click", (event) => {

    if (event.target.id !== "switchBtn") return;

    isSignup = !isSignup;

    nameInput.classList.toggle("hidden", !isSignup);

    submitBtn.textContent = isSignup
        ? "Create Account"
        : "Login";

    passwordInput.autocomplete = isSignup
        ? "new-password"
        : "current-password";

    switchText.innerHTML = isSignup
        ? 'Already have an account? <span id="switchBtn">Login</span>'
        : 'Don\'t have an account? <span id="switchBtn">Sign Up</span>';

    showMessage("");
});


// EMAIL LOGIN / SIGNUP

submitBtn.addEventListener("click", async () => {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        showMessage("Please enter your email and password.");
        return;
    }

    if (isSignup && password.length < 6) {
        showMessage("Password must contain at least 6 characters.");
        return;
    }

    submitBtn.disabled = true;

    try {

        if (isSignup) {

            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

            window.location.href = "enrollment.html";

        } else {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            window.location.href = "index.html";

        }

    } catch (error) {

        console.error(error);

        if (error.code === "auth/invalid-credential") {
            showMessage("Invalid email or password. Please check your details.");
        }
        else if (error.code === "auth/email-already-in-use") {
            showMessage("This email is already registered. Please login instead.");
        }
        else if (error.code === "auth/weak-password") {
            showMessage("Please choose a stronger password.");
        }
        else if (error.code === "auth/unauthorized-domain") {
            showMessage("This website domain is not authorized in Firebase.");
        }
        else {
            showMessage(error.message);
        }

    } finally {
        submitBtn.disabled = false;
    }

});


// GOOGLE LOGIN

googleBtn.addEventListener("click", async () => {

    googleBtn.disabled = true;

    try {

        await signInWithPopup(auth, provider);

        // Auth state listener handles the next screen.

    } catch (error) {

        console.error(error);

        if (error.code === "auth/unauthorized-domain") {
            showMessage("Please authorize this website domain in Firebase.");
        }
        else {
            showMessage(error.message);
        }

    } finally {
        googleBtn.disabled = false;
    }

});


// LINK PASSWORD TO EXISTING GOOGLE ACCOUNT

linkPasswordBtn.addEventListener("click", async () => {

    const user = auth.currentUser;

    if (!user) {
        showMessage("Please login with Google first.");
        return;
    }

    const password = newPasswordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (password.length < 6) {
        showMessage("Password must contain at least 6 characters.");
        return;
    }

    if (password !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
    }

    if (hasProvider(user, "password")) {
        showMessage("Email and password are already linked.");
        return;
    }

    linkPasswordBtn.disabled = true;

    try {

        const credential = EmailAuthProvider.credential(
            user.email,
            password
        );

        await linkWithCredential(user, credential);

        showMessage("Email and Password successfully linked!");

        newPasswordInput.value = "";
        confirmPasswordInput.value = "";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1200);

    } catch (error) {

        console.error(error);

        if (error.code === "auth/credential-already-in-use" ||
            error.code === "auth/email-already-in-use") {
            showMessage("This email or password credential belongs to another account. No account was deleted or merged.");
        }
        else if (error.code === "auth/weak-password") {
            showMessage("Please choose a stronger password.");
        }
        else {
            showMessage(error.message);
        }

    } finally {
        linkPasswordBtn.disabled = false;
    }

});


// LOGOUT FROM LINK PANEL

cancelLinkBtn.addEventListener("click", async () => {

    try {
        await signOut(auth);
        showMessage("You have logged out.");

    } catch (error) {
        showMessage(error.message);
    }

});


// FORGOT PASSWORD

forgotBtn.addEventListener("click", async () => {

    const email = emailInput.value.trim();

    if (!email) {
        showMessage("Please enter your email address first.");
        return;
    }

    try {

        await sendPasswordResetEmail(auth, email);

        showMessage("If password reset is available, check your email inbox.");

    } catch (error) {

        console.error(error);

        showMessage("Unable to send reset email. Check the email and account provider.");

    }

});

</script>

</body>
</html>
