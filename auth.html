
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisualVersa | Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: #1c1c1c;
    padding: 35px;
    border-radius: 15px;
    border: 1px solid #d9ad75;
    text-align: center;
}

h1 {
    color: #d9ad75;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    background: #292929;
    color: white;
    border: 1px solid #555;
    border-radius: 7px;
    outline: none;
}

input:focus {
    border-color: #d9ad75;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    background: #d9ad75;
    color: #111;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #efc99a;
}

.google {
    background: transparent;
    color: white;
    border: 1px solid #d9ad75;
}

.google:hover {
    background: #292929;
}

.switch {
    color: #d9ad75;
    cursor: pointer;
    margin-top: 20px;
}

.forgot {
    color: #aaa;
    text-align: right;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
}

#message {
    color: #d9ad75;
    margin-top: 15px;
    font-size: 14px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <h1>VisualVersa</h1>
    <p class="subtitle">Explore Creativity. Discover Inspiration.</p>

    <form id="authForm">
        <input type="text" id="name" placeholder="Your Name" class="hidden">

        <input type="email" id="email" placeholder="Email Address" required>

        <input type="password" id="password" placeholder="Password" required>

        <p class="forgot" id="forgot">Forgot Password?</p>

        <button type="submit" id="submitBtn">Login</button>
    </form>

    <button class="google" id="googleBtn">Continue with Google</button>

    <p class="switch" id="switchBtn">
        Don't have an account? Sign Up
    </p>

    <p id="message"></p>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    sendPasswordResetEmail
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyA8AjN2InsgSG9_smQVAwCnqTaiTPyOxpE",
    authDomain: "visualversa-ec2dc.firebaseapp.com",
    projectId: "visualversa-ec2dc",
    storageBucket: "visualversa-ec2dc.firebasestorage.app",
    messagingSenderId: "721396543460",
    appId: "1:721396543460:web:39e033c4ba0b51599aa1f1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let isSignup = false;

const form = document.getElementById("authForm");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const submitBtn = document.getElementById("submitBtn");
const switchBtn = document.getElementById("switchBtn");
const googleBtn = document.getElementById("googleBtn");
const forgotBtn = document.getElementById("forgot");
const message = document.getElementById("message");

switchBtn.addEventListener("click", () => {
    isSignup = !isSignup;

    nameInput.classList.toggle("hidden", !isSignup);
    nameInput.required = isSignup;

    submitBtn.textContent = isSignup ? "Create Account" : "Login";

    switchBtn.textContent = isSignup
        ? "Already have an account? Login"
        : "Don't have an account? Sign Up";

    message.textContent = "";
});

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    message.textContent = "Please wait...";

    try {
        if (isSignup) {
            await createUserWithEmailAndPassword(
                auth, email, password
            );

            message.textContent = "Account created successfully!";

            window.location.href = "enrollment.html";

        } else {
            await signInWithEmailAndPassword(
                auth, email, password
            );

            message.textContent = "Login successful!";

            window.location.href = "index.html";
        }

    } catch (error) {
        message.textContent = error.message;
    }
});

googleBtn.addEventListener("click", async () => {
    message.textContent = "Connecting to Google...";

    try {
        await signInWithPopup(auth, provider);

        message.textContent = "Google login successful!";

        window.location.href = "index.html";

    } catch (error) {
        message.textContent = error.message;
    }
});

forgotBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();

    if (!email) {
        message.textContent = "Please enter your email first.";
        return;
    }

    try {
        await sendPasswordResetEmail(auth, email);
        message.textContent = "Password reset email sent!";

    } catch (error) {
        message.textContent = error.message;
    }
});

</script>

</body>
</html>
