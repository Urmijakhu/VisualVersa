<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisualVersa | Login & Signup</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eeeaff, #fceeff);
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    .brand {
      text-align: center;
      color: #6554c0;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin-bottom: 22px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #444;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #6554c0;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #6554c0;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #5141a5;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .google-btn {
      background: white;
      color: #333;
      border: 1px solid #ccc;
    }

    .google-btn:hover {
      background: #f5f5f5;
    }

    .links {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #555;
    }

    .links a {
      color: #6554c0;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .forgot {
      text-align: right;
      margin-top: -5px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .forgot a {
      color: #6554c0;
      cursor: pointer;
      text-decoration: none;
    }

    #signupSection,
    #profileSection {
      display: none;
    }

    #message {
      text-align: center;
      font-size: 14px;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }

    .profile {
      text-align: center;
    }

    .profile p {
      margin: 12px 0;
      color: #555;
      overflow-wrap: anywhere;
    }

    .logout-btn {
      background: #e74c3c;
    }

    .logout-btn:hover {
      background: #c0392b;
    }
  </style>
</head>

<body>

  <div class="auth-container">

    <h1 class="brand">VisualVersa</h1>
    <p class="subtitle">Explore your creative world</p>

    <!-- LOGIN SECTION -->
    <section id="loginSection">

      <h2>Welcome Back</h2>

      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail"
               placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword"
               placeholder="Enter your password">
      </div>

      <div class="forgot">
        <a id="forgotPassword">Forgot Password?</a>
      </div>

      <button id="loginBtn">Login</button>

      <button class="google-btn" id="googleLoginBtn">
        Continue with Google
      </button>

      <p class="links">
        Don't have an account?
        <a id="showSignup">Sign Up</a>
      </p>

    </section>

    <!-- SIGNUP SECTION -->
    <section id="signupSection">

      <h2>Create Account</h2>

      <div class="form-group">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName"
               placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail"
               placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword"
               placeholder="Create a password">
      </div>

      <button id="signupBtn">Create Account</button>

      <button class="google-btn" id="googleSignupBtn">
        Sign Up with Google
      </button>

      <p class="links">
        Already have an account?
        <a id="showLogin">Login</a>
      </p>

    </section>

    <!-- USER PROFILE SECTION -->
    <section id="profileSection">

      <div class="profile">
        <h2>Welcome to VisualVersa!</h2>

        <p id="profileName"></p>
        <p id="profileEmail"></p>

        <button class="logout-btn" id="logoutBtn">
          Logout
        </button>
      </div>

    </section>

    <p id="message" role="status" aria-live="polite"></p>

  </div>

  <!-- FIREBASE AUTHENTICATION -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      sendPasswordResetEmail,
      updateProfile,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    // ==================================
    // FIREBASE CONFIGURATION
    // Add your new Firebase config here
    // ==================================

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();


    // HTML ELEMENTS
    const loginSection = document.getElementById("loginSection");
    const signupSection = document.getElementById("signupSection");
    const profileSection = document.getElementById("profileSection");
    const message = document.getElementById("message");


    // MESSAGE FUNCTION
    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color = success ? "green" : "red";
    }


    // SWITCH TO SIGNUP
    document.getElementById("showSignup").addEventListener("click", () => {
      loginSection.style.display = "none";
      signupSection.style.display = "block";
      showMessage("");
    });


    // SWITCH TO LOGIN
    document.getElementById("showLogin").addEventListener("click", () => {
      signupSection.style.display = "none";
      loginSection.style.display = "block";
      showMessage("");
    });


    // EMAIL SIGNUP
    document.getElementById("signupBtn").addEventListener("click", async () => {

      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;

      if (!name || !email || !password) {
        showMessage("Please fill in all fields.");
        return;
      }

      if (password.length < 6) {
        showMessage("Password must contain at least 6 characters.");
        return;
      }

      try {
        const result = await createUserWithEmailAndPassword(
          auth, email, password
        );

        await updateProfile(result.user, {
          displayName: name
        });

        showMessage("Account created successfully!", true);

      } catch (error) {
        showMessage(error.message);
      }

    });


    // EMAIL LOGIN
    document.getElementById("loginBtn").addEventListener("click", async () => {

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (!email || !password) {
        showMessage("Please enter your email and password.");
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showMessage("Login successful!", true);

      } catch (error) {
        showMessage(error.message);
      }

    });


    // GOOGLE LOGIN
    async function googleLogin() {

      try {
        await signInWithPopup(auth, googleProvider);
        showMessage("Google login successful!", true);

      } catch (error) {
        showMessage(error.message);
      }

    }

    document.getElementById("googleLoginBtn")
      .addEventListener("click", googleLogin);

    document.getElementById("googleSignupBtn")
      .addEventListener("click", googleLogin);


    // FORGOT PASSWORD
    document.getElementById("forgotPassword")
      .addEventListener("click", async () => {

        const email = document.getElementById("loginEmail").value.trim();

        if (!email) {
          showMessage("Please enter your email first.");
          return;
        }

        try {
          await sendPasswordResetEmail(auth, email);
          showMessage("Password reset email sent!", true);

        } catch (error) {
          showMessage(error.message);
        }

      });


    // CHECK AUTHENTICATION STATE
    onAuthStateChanged(auth, (user) => {

      if (user) {

        loginSection.style.display = "none";
        signupSection.style.display = "none";
        profileSection.style.display = "block";

        document.getElementById("profileName").textContent =
          "Name: " + (user.displayName || "User");

        document.getElementById("profileEmail").textContent =
          "Email: " + user.email;

      } else {

        profileSection.style.display = "none";
        signupSection.style.display = "none";
        loginSection.style.display = "block";

      }

    });


    // LOGOUT
    document.getElementById("logoutBtn")
      .addEventListener("click", async () => {

        try {
          await signOut(auth);
          showMessage("Logged out successfully!", true);

        } catch (error) {
          showMessage(error.message);
        }

      });

  </script>

</body>
</html>
