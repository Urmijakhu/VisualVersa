<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisualVersa | Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --gold: #d9ad75;
    --dark: #080808;
    --card: #111111;
    --text: #ffffff;
    --muted: #999999;
}

body {
    min-height: 100vh;
    background: var(--dark);
    color: var(--text);
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: var(--card);
    border: 1px solid rgba(217,173,117,0.35);
    border-radius: 25px;
    padding: 38px 32px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.6);
}

.logo {
    text-align: center;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 12px;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 30px;
}

.tabs {
    display: flex;
    background: #1b1b1b;
    border-radius: 30px;
    padding: 5px;
    margin-bottom: 28px;
}

.tabs button {
    width: 50%;
    padding: 12px;
    border: none;
    border-radius: 25px;
    background: transparent;
    color: #aaa;
    cursor: pointer;
    font-size: 14px;
    transition: 0.3s;
}

.tabs button.active {
    background: var(--gold);
    color: #111;
    font-weight: bold;
}

h2 {
    text-align: center;
    font-size: 23px;
    margin-bottom: 8px;
}

.description {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 25px;
}

.input-group {
    margin-bottom: 17px;
}

.input-group label {
    display: block;
    font-size: 13px;
    margin-bottom: 8px;
    color: #ddd;
}

.input-group input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #333;
    background: #080808;
    color: white;
    border-radius: 14px;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
}

.input-group input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 8px rgba(217,173,117,0.15);
}

.forgot {
    text-align: right;
    margin-top: -5px;
    margin-bottom: 20px;
}

.forgot button {
    background: none;
    border: none;
    color: var(--gold);
    cursor: pointer;
    font-size: 12px;
}

.main-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 30px;
    background: var(--gold);
    color: #111;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.main-btn:hover {
    background: #edc99b;
    transform: translateY(-2px);
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 23px 0;
    color: #777;
    font-size: 12px;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    flex: 1;
    background: #333;
}

.google-btn {
    width: 100%;
    padding: 13px;
    border: 1px solid #444;
    border-radius: 30px;
    background: transparent;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 14px;
    transition: 0.3s;
}

.google-btn:hover {
    border-color: var(--gold);
    background: #191919;
}

.google-icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #4285F4;
    font-size: 17px;
}

.message {
    display: none;
    padding: 12px;
    margin-bottom: 18px;
    border-radius: 12px;
    font-size: 13px;
    text-align: center;
    line-height: 1.5;
}

.message.error {
    display: block;
    background: rgba(255,70,70,0.1);
    color: #ff8585;
    border: 1px solid rgba(255,70,70,0.3);
}

.message.success {
    display: block;
    background: rgba(60,200,120,0.1);
    color: #7ee0a5;
    border: 1px solid rgba(60,200,120,0.3);
}

.footer {
    text-align: center;
    color: #777;
    font-size: 11px;
    margin-top: 25px;
}

.back-home {
    text-align: center;
    margin-top: 20px;
}

.back-home a {
    color: var(--gold);
    text-decoration: none;
    font-size: 13px;
}

.back-home a:hover {
    text-decoration: underline;
}

@media(max-width:480px) {
    .container {
        padding: 30px 22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">VISUALVERSA</div>
    <p class="subtitle">Explore. Create. Connect.</p>

    <div class="tabs">
        <button id="loginTab" class="active" type="button">Login</button>
        <button id="signupTab" type="button">Sign Up</button>
    </div>

    <h2 id="formTitle">Welcome Back</h2>
    <p class="description" id="formDescription">
        Login to continue your journey.
    </p>

    <div id="message" class="message"></div>

    <form id="authForm">

        <div class="input-group" id="nameGroup" style="display:none;">
            <label>Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                autocomplete="name">
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>
        </div>

        <div class="forgot" id="forgotBox">
            <button type="button" id="forgotBtn">
                Forgot Password?
            </button>
        </div>

        <button type="submit" class="main-btn" id="submitBtn">
            Login
        </button>

    </form>

    <div class="divider">OR CONTINUE WITH</div>

    <button type="button" class="google-btn" id="googleBtn">
        <span class="google-icon">G</span>
        Continue with Google
    </button>

    <div class="back-home">
        <a href="index.html">← Back to Home</a>
    </div>

    <div class="footer">
        © 2026 VisualVersa. All Rights Reserved.
    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    sendPasswordResetEmail,
    updateProfile,
    onAuthStateChanged,
    getAdditionalUserInfo
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
    apiKey: "AIzaSyA8AjN2InsgSG9_smQVAwCnqTaiTPyOxpE",
    authDomain: "visualversa-ec2dc.firebaseapp.com",
    projectId: "visualversa-ec2dc",
    storageBucket: "visualversa-ec2dc.firebasestorage.app",
    messagingSenderId: "721396543460",
    appId: "1:721396543460:web:39e033c4ba0b51599aa1f1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const googleProvider = new GoogleAuthProvider();


/* HTML ELEMENTS */

const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");

const formTitle = document.getElementById("formTitle");
const formDescription = document.getElementById("formDescription");

const nameGroup = document.getElementById("nameGroup");
const nameInput = document.getElementById("name");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const forgotBox = document.getElementById("forgotBox");
const forgotBtn = document.getElementById("forgotBtn");

const submitBtn = document.getElementById("submitBtn");
const googleBtn = document.getElementById("googleBtn");

const authForm = document.getElementById("authForm");
const messageBox = document.getElementById("message");


let currentMode = "login";
let authActionInProgress = false;


/* MESSAGE FUNCTION */

function showMessage(message, type = "error") {
    messageBox.textContent = message;
    messageBox.className = "message " + type;
}

function clearMessage() {
    messageBox.textContent = "";
    messageBox.className = "message";
}


/* SWITCH LOGIN AND SIGNUP */

function setMode(mode) {

    currentMode = mode;
    clearMessage();

    if (mode === "signup") {

        loginTab.classList.remove("active");
        signupTab.classList.add("active");

        nameGroup.style.display = "block";
        nameInput.required = true;

        formTitle.textContent = "Create Account";
        formDescription.textContent =
            "Join VisualVersa and start exploring.";

        submitBtn.textContent = "Create Account";

        forgotBox.style.display = "none";

        passwordInput.autocomplete = "new-password";

    } else {

        signupTab.classList.remove("active");
        loginTab.classList.add("active");

        nameGroup.style.display = "none";
        nameInput.required = false;

        formTitle.textContent = "Welcome Back";
        formDescription.textContent =
            "Login to continue your journey.";

        submitBtn.textContent = "Login";

        forgotBox.style.display = "block";

        passwordInput.autocomplete = "current-password";
    }
}

loginTab.addEventListener("click", () => setMode("login"));
signupTab.addEventListener("click", () => setMode("signup"));


/* AUTH STATE LISTENER */

onAuthStateChanged(auth, (user) => {

    if (authActionInProgress) return;

    if (user) {
        window.location.replace("index.html");
    }

});


/* EMAIL LOGIN AND SIGNUP */

authForm.addEventListener("submit", async (e) => {

    e.preventDefault();
    clearMessage();

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const name = nameInput.value.trim();

    if (currentMode === "signup" && !name) {
        showMessage("Please enter your full name.");
        return;
    }

    authActionInProgress = true;
    submitBtn.disabled = true;
    submitBtn.textContent = "Please wait...";

    try {

        if (currentMode === "signup") {

            const result = await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

            await updateProfile(result.user, {
                displayName: name
            });

            showMessage(
                "Account created successfully! Opening enrollment form...",
                "success"
            );

           window.location.replace("https://visualversa.vercel.app/enrollment.html");
            
        } else {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            showMessage(
                "Login successful! Redirecting...",
                "success"
            );

            window.location.replace("index.html");
        }

    } catch (error) {

        authActionInProgress = false;

        if (error.code === "auth/email-already-in-use") {

            showMessage(
                "This email is already registered. Please Login."
            );

        } else if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found"
        ) {

            showMessage(
                "Incorrect email or password. If you are new, please Sign Up."
            );

        } else if (error.code === "auth/weak-password") {

            showMessage(
                "Password should contain at least 6 characters."
            );

        } else if (error.code === "auth/invalid-email") {

            showMessage("Please enter a valid email address.");

        } else if (error.code === "auth/network-request-failed") {

            showMessage("Network error. Please check your internet connection.");

        } else {

            showMessage(error.message);
        }

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent =
            currentMode === "signup" ? "Create Account" : "Login";
    }

});


/* GOOGLE LOGIN AND SIGNUP */

googleBtn.addEventListener("click", async () => {

    clearMessage();

    authActionInProgress = true;
    googleBtn.disabled = true;
    googleBtn.textContent = "Connecting...";

    try {

        const result = await signInWithPopup(
            auth,
            googleProvider
        );

        const userInfo = getAdditionalUserInfo(result);

        if (userInfo && userInfo.isNewUser) {

            showMessage(
                "Account created! Opening enrollment form...",
                "success"
            );

           window.location.replace("https://visualversa.vercel.app/enrollment.html");

        } else {

            showMessage(
                "Welcome back! Redirecting...",
                "success"
            );

            window.location.replace("index.html");
        }

    } catch (error) {

        authActionInProgress = false;

        if (error.code === "auth/popup-closed-by-user") {

            showMessage("Google sign-in was cancelled.");

        } else if (error.code === "auth/popup-blocked") {

            showMessage("Please allow popups for this website.");

        } else {

            showMessage(error.message);
        }

    } finally {

        googleBtn.disabled = false;
        googleBtn.innerHTML =
            '<span class="google-icon">G</span> Continue with Google';
    }

});


/* FORGOT PASSWORD */

forgotBtn.addEventListener("click", async () => {

    clearMessage();

    const email = emailInput.value.trim();

    if (!email) {

        showMessage("Please enter your email address first.");
        emailInput.focus();
        return;
    }

    try {

        await sendPasswordResetEmail(auth, email);

        showMessage(
            "Password reset email sent. Please check your inbox.",
            "success"
        );

    } catch (error) {

        if (error.code === "auth/invalid-email") {

            showMessage("Please enter a valid email address.");

        } else if (error.code === "auth/user-not-found") {

            showMessage("No account found with this email.");

        } else {

            showMessage(error.message);
        }

    }

});

</script>

</body>
</html>
